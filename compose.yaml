# Optional local PostgreSQL. The credentials are development-only examples.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: property_dev
      POSTGRES_PASSWORD: property_dev_password
      POSTGRES_DB: property_management
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - property_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_dev -d property_management"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  property_postgres_data:
